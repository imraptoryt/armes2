<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Vulture — Inventaire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a0c; --bg2:#101013; --panel:#16161a; --panel2:#1d1d22; --panel3:#26262d;
    --line:#2a2a31; --line2:#37373f;
    --txt:#e8e6e3; --txt-dim:#9a978f; --txt-faint:#5f5c57;
    --orange:#ff7a00; --orange-d:#cc6200; --orange-l:#ffa040; --amber:#ffb347;
    --green:#3fb950; --red:#f04438; --blue:#4493f8;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:var(--sans);background:radial-gradient(1100px 600px at 85% -5%,rgba(255,122,0,.08),transparent 55%),radial-gradient(900px 500px at 5% 105%,rgba(255,122,0,.05),transparent 55%),var(--bg);color:var(--txt);min-height:100vh}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#33333b;border-radius:6px}::-webkit-scrollbar-thumb:hover{background:#44444e}
  a{color:var(--orange-l);text-decoration:none}

  /* ===== HEADER ===== */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:14px 28px;background:linear-gradient(180deg,rgba(16,16,19,.96),rgba(16,16,19,.82));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .logo{width:46px;height:46px;border-radius:11px;object-fit:cover;border:1px solid var(--line2);background:#000;box-shadow:0 0 0 3px rgba(255,122,0,.10),0 8px 22px rgba(0,0,0,.5)}
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand .bn{font-size:19px;font-weight:800;letter-spacing:1px}
  .brand .bn span{color:var(--orange)}
  .brand .bs{font-size:10.5px;letter-spacing:3px;color:var(--txt-dim);text-transform:uppercase;margin-top:3px;font-family:var(--mono)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .sync-pill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--txt-dim);padding:6px 12px;border:1px solid var(--line2);border-radius:20px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--txt-faint);transition:.3s}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}

  /* ===== LAYOUT ===== */
  .wrap{max-width:1280px;margin:0 auto;padding:26px 28px 60px}

  /* ===== STAT CARDS ===== */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;background:radial-gradient(circle,rgba(255,122,0,.14),transparent 70%)}
  .stat .sv{font-size:30px;font-weight:800;letter-spacing:.5px}
  .stat .sl{font-size:11px;letter-spacing:1.5px;color:var(--txt-dim);text-transform:uppercase;margin-top:4px;font-family:var(--mono)}
  .stat .si{position:absolute;right:16px;top:16px;opacity:.5}

  /* ===== TOOLBAR ===== */
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 15px}
  .search input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-size:14px;font-family:var(--sans)}
  .search svg{flex-shrink:0;opacity:.6}
  .cats{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:9px 15px;border-radius:20px;border:1px solid var(--line2);background:var(--panel);color:var(--txt-dim);font-size:12.5px;cursor:pointer;transition:.14s;font-family:var(--mono);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .chip:hover{border-color:var(--orange-d);color:var(--txt)}
  .chip.active{background:linear-gradient(180deg,var(--orange),var(--orange-d));border-color:var(--orange);color:#1a0f00;font-weight:700}
  .chip .cc{font-size:10px;opacity:.8}

  /* ===== STORAGE SECTIONS ===== */
  .storage{margin-bottom:24px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
  .storage-head{display:flex;align-items:center;gap:13px;padding:15px 20px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line);cursor:pointer}
  .storage-head .shic{width:36px;height:36px;border-radius:9px;background:rgba(255,122,0,.12);border:1px solid var(--orange-d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .storage-head .shn{font-size:16px;font-weight:700;letter-spacing:.4px}
  .storage-head .shm{font-size:11px;color:var(--txt-dim);font-family:var(--mono);margin-top:2px}
  .storage-head .shtot{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--orange-l);background:rgba(255,122,0,.08);border:1px solid var(--orange-d);padding:5px 12px;border-radius:8px}
  .storage-head .chev{margin-left:14px;transition:.2s;opacity:.6}
  .storage.collapsed .chev{transform:rotate(-90deg)}
  .storage.collapsed .grid{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;padding:18px}
  .item{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:13px;transition:.14s;position:relative}
  .item:hover{border-color:var(--orange-d);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.4)}
  .item .iic{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,122,0,.10);border:1px solid var(--line2)}
  .item .iname{font-size:14px;font-weight:600;line-height:1.25}
  .item .icat{font-size:10px;color:var(--txt-faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
  .item .iqty{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:800;color:var(--orange-l)}
  .item.low .iqty{color:var(--red)}
  .item .ibadge{position:absolute;top:-7px;right:10px;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
  .item .ibadge.up{background:rgba(63,185,80,.16);color:var(--green);border:1px solid #2c7a37}
  .item .ibadge.down{background:rgba(240,68,56,.16);color:var(--red);border:1px solid #9e2a20}

  .empty{padding:70px 20px;text-align:center;color:var(--txt-faint);font-family:var(--mono)}
  .empty svg{opacity:.3;margin-bottom:16px}

  /* ===== ACTIVITY FEED ===== */
  .feed-title{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--txt-dim);font-family:var(--mono);margin:34px 0 16px}
  .feed-title::before,.feed-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .feed{display:flex;flex-direction:column;gap:8px}
  .fline{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:13px}
  .fline .fdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .fline.up .fdot{background:var(--green)} .fline.down .fdot{background:var(--red)}
  .fline .fdelta{font-family:var(--mono);font-weight:800;min-width:46px}
  .fline.up .fdelta{color:var(--green)} .fline.down .fdelta{color:var(--red)}
  .fline .fitem{font-weight:600}
  .fline .floc{color:var(--txt-dim);font-family:var(--mono);font-size:12px}
  .fline .ftime{margin-left:auto;color:var(--txt-faint);font-family:var(--mono);font-size:11px}

  .footer{text-align:center;color:var(--txt-faint);font-family:var(--mono);font-size:11px;margin-top:50px;letter-spacing:1px}

  @media(max-width:600px){.wrap{padding:18px 14px 50px}.topbar{padding:12px 16px}.brand .bn{font-size:16px}}
</style>
</head>
<body>

<div class="topbar">
  <img class="logo" src="https://imgg.fr/r/94agnuhj.png" alt="Black Vulture" onerror="this.style.display='none'">
  <div class="brand">
    <div class="bn">BLACK <span>VULTURE</span></div>
    <div class="bs">Inventaire · Stockages</div>
  </div>
  <div class="top-right">
    <div class="sync-pill"><span class="dot" id="syncDot"></span><span id="syncTxt">Connexion…</span></div>
  </div>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9a978f" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInput" placeholder="Rechercher un objet ou un stockage…" autocomplete="off">
    </div>
    <div class="cats" id="cats"></div>
  </div>

  <div id="storages"></div>

  <div class="feed-title">Activité récente</div>
  <div class="feed" id="feed"></div>

  <div class="footer">BLACK VULTURE · données synchronisées en temps réel · rapport quotidien à minuit</div>
</div>

<script>
/* ====== CONFIG (même projet Supabase que le bot) ====== */
const SUPABASE_URL = "https://fgzmbkomdbggfqforxzn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y8LbGUHwi7PSnXhhOCLE4Q_9iu3WgVk";
const LOW_STOCK = 3; // sous ce seuil, la quantité passe en rouge

const CAT_META = {
  "Armes":      {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffa040" stroke-width="1.6"><path d="M3 7h13l3 3v2h-2l-2-2H9l-2 4H4z"/><path d="M7 14v3"/></svg>'},
  "Munitions":  {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffa040" stroke-width="1.6"><rect x="8" y="3" width="8" height="13" rx="3"/><path d="M9 16h6v4H9z"/></svg>'},
  "Équipement": {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffa040" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg>'},
  "Drogues":    {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffa040" stroke-width="1.6"><path d="M10.5 3.5l10 10a5 5 0 01-7 7l-10-10a5 5 0 017-7z"/><path d="M8 8l8 8"/></svg>'},
  "Argent":     {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffa040" stroke-width="1.6"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>'},
  "Divers":     {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffa040" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'},
};
function catIcon(c){return (CAT_META[c]||CAT_META["Divers"]).ic;}
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

/* ====== STATE ====== */
let ITEMS = [];          // [{storage,item,category,qty}]
let TX = [];             // transactions du jour (pour badges + feed)
let activeCat = "Toutes";
let search = "";
const collapsed = new Set();

/* ====== SUPABASE ====== */
let sb=null;
function sbInit(){
  if(!window.supabase || SUPABASE_URL.includes("YOUR-")) { setSync(false); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime:{ params:{ eventsPerSecond:10 } } });
}
function setSync(live){
  const d=document.getElementById("syncDot"), t=document.getElementById("syncTxt");
  d.className = "dot " + (live?"live":"off");
  t.textContent = live ? "En direct" : "Hors ligne";
}
function parisDay(d=new Date()){ return new Intl.DateTimeFormat("fr-CA",{timeZone:"Europe/Paris"}).format(d); }

async function loadAll(){
  if(!sb) return;
  try{
    const [{data:items,error:e1},{data:tx,error:e2}] = await Promise.all([
      sb.from("bv_items").select("*").gt("qty",0),
      sb.from("bv_transactions").select("*").eq("day",parisDay()).order("ts",{ascending:false})
    ]);
    if(e1||e2){ console.warn("[bv] load error",e1||e2); setSync(false); return; }
    ITEMS = items||[]; TX = tx||[];
    setSync(true);
    render();
  }catch(err){ console.warn("[bv] load threw",err); setSync(false); }
}

function subscribe(){
  if(!sb) return;
  sb.channel("bv_live")
    .on("postgres_changes",{event:"*",schema:"public",table:"bv_items"},     ()=>loadAll())
    .on("postgres_changes",{event:"*",schema:"public",table:"bv_transactions"},()=>loadAll())
    .subscribe(st=>{ console.log("[bv] channel:",st); if(st==="SUBSCRIBED") setSync(true); });
}

/* ====== RENDER ====== */
function dayDelta(storage,item){
  return TX.filter(t=>t.storage===storage && t.item===item).reduce((a,t)=>a+t.delta,0);
}
function categories(){
  const counts={};
  ITEMS.forEach(i=>{counts[i.category]=(counts[i.category]||0)+1;});
  return counts;
}
function filtered(){
  return ITEMS.filter(i=>{
    if(activeCat!=="Toutes" && i.category!==activeCat) return false;
    if(search){ const q=search.toLowerCase(); if(!(i.item.toLowerCase().includes(q)||i.storage.toLowerCase().includes(q))) return false; }
    return true;
  });
}

function renderStats(){
  const totalItems = ITEMS.reduce((a,i)=>a+i.qty,0);
  const refs = ITEMS.length;
  const storages = new Set(ITEMS.map(i=>i.storage)).size;
  const moves = TX.length;
  const data=[
    {v:totalItems, l:"Objets en stock", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="1.6"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>'},
    {v:refs, l:"Références", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="1.6"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>'},
    {v:storages, l:"Stockages", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="1.6"><path d="M3 9l9-6 9 6v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg>'},
    {v:(moves>0?"+":"")+moves, l:"Mouvements aujourd'hui", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="1.6"><path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h6v6"/></svg>'},
  ];
  document.getElementById("stats").innerHTML = data.map(s=>
    `<div class="stat"><div class="si">${s.ic}</div><div class="sv">${s.v}</div><div class="sl">${s.l}</div></div>`).join("");
}

function renderCats(){
  const counts=categories();
  const all=Object.values(counts).reduce((a,b)=>a+b,0);
  let html=`<div class="chip ${activeCat==="Toutes"?"active":""}" data-cat="Toutes">Toutes <span class="cc">${all}</span></div>`;
  Object.keys(counts).sort().forEach(c=>{
    html+=`<div class="chip ${activeCat===c?"active":""}" data-cat="${c}">${c} <span class="cc">${counts[c]}</span></div>`;
  });
  const el=document.getElementById("cats");
  el.innerHTML=html;
  el.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{activeCat=ch.dataset.cat;render();});
}

function renderStorages(){
  const list=filtered();
  const byStorage={};
  list.forEach(i=>{(byStorage[i.storage]=byStorage[i.storage]||[]).push(i);});
  const cont=document.getElementById("storages");

  if(!list.length){
    cont.innerHTML=`<div class="empty"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#5f5c57" stroke-width="1.3"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg><div>${ITEMS.length? "Aucun résultat pour ce filtre." : "Aucun stock enregistré pour l'instant.<br>Les mouvements postés dans Discord apparaîtront ici."}</div></div>`;
    return;
  }

  cont.innerHTML = Object.keys(byStorage).sort().map(storage=>{
    const items=byStorage[storage].sort((a,b)=>b.qty-a.qty);
    const total=items.reduce((a,i)=>a+i.qty,0);
    const isCol=collapsed.has(storage);
    const cards=items.map(it=>{
      const d=dayDelta(storage,it.item);
      const badge = d!==0 ? `<span class="ibadge ${d>0?"up":"down"}">${d>0?"+":""}${d} auj.</span>` : "";
      return `<div class="item ${it.qty<=LOW_STOCK?"low":""}">
        ${badge}
        <div class="iic">${catIcon(it.category)}</div>
        <div><div class="iname">${cap(it.item)}</div><div class="icat">${it.category}</div></div>
        <div class="iqty">${it.qty}</div>
      </div>`;
    }).join("");
    return `<div class="storage ${isCol?"collapsed":""}" data-storage="${storage}">
      <div class="storage-head">
        <div class="shic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="1.7"><path d="M3 9l9-6 9 6v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M9 21V12h6v9"/></svg></div>
        <div><div class="shn">${cap(storage)}</div><div class="shm">${items.length} référence${items.length>1?"s":""}</div></div>
        <div class="shtot">${total} obj.</div>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a978f" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="grid">${cards}</div>
    </div>`;
  }).join("");

  cont.querySelectorAll(".storage-head").forEach(h=>h.onclick=()=>{
    const s=h.parentElement.dataset.storage;
    if(collapsed.has(s))collapsed.delete(s); else collapsed.add(s);
    h.parentElement.classList.toggle("collapsed");
  });
}

function renderFeed(){
  const el=document.getElementById("feed");
  if(!TX.length){ el.innerHTML=`<div class="empty" style="padding:30px">Aucun mouvement aujourd'hui.</div>`; return; }
  el.innerHTML = TX.slice(0,30).map(t=>{
    const time=new Date(t.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"});
    return `<div class="fline ${t.delta>0?"up":"down"}">
      <span class="fdot"></span>
      <span class="fdelta">${t.delta>0?"+":""}${t.delta}</span>
      <span class="fitem">${cap(t.item)}</span>
      <span class="floc">› ${cap(t.storage)}</span>
      <span class="ftime">${time}${t.author?" · "+t.author:""}</span>
    </div>`;
  }).join("");
}

function render(){ renderStats(); renderCats(); renderStorages(); renderFeed(); }

document.getElementById("searchInput").addEventListener("input",e=>{search=e.target.value;renderStorages();});

/* ====== INIT ====== */
sbInit();
loadAll().then(subscribe);
setInterval(loadAll, 30000); // filet de sécurité si le websocket tombe
</script>
</body>
</html>
